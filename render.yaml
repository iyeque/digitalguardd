services:
  # 1. The FastAPI Backend
  - type: web
    name: elise-learns-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: |
      if [ ! -f en_US-amy-low.onnx ]; then
        echo "Downloading Piper model..."
        curl -L -o en_US-amy-low.onnx https://github.com/rhasspy/piper/releases/download/v0.0.2/en_US-amy-low.onnx
        curl -L -o en_US-amy-low.onnx.json https://github.com/rhasspy/piper/releases/download/v0.0.2/en_US-amy-low.onnx.json
      fi
      gunicorn server:app --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DB_NAME
        value: elise
      - key: CORS_ORIGINS
        value: "*"
    healthCheckPath: /api/health
